name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (Java-Kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: +security-and-quality

    - name: Build project for CodeQL
      run: |
        ./gradlew --no-daemon --no-build-cache \
          :androidApp:compileDebugKotlin \
          :androidApp:compileDebugJavaWithJavac \
          :shared:compileAndroidMain \
          :data:compileAndroidMain \
          :analytics:compileAndroidMain \
          :analytics:compileKotlinJvm \
          :billing:compileAndroidMain \
          :billing:compileKotlinJvm \
          :domain:compileKotlinJvm \
          :architecture:testClasses

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
